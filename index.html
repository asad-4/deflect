<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deflect</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="vignette"></div>
      <div id="flash"></div>

      <section id="boss-panel">
        <div class="name">The Ashen Warden</div>
        <div class="bar health"><div class="fill"></div><div class="trail"></div></div>
        <div class="posture"><div class="fill"></div></div>
      </section>

      <div id="warning" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="96" height="96">
          <polygon points="50,6 94,50 50,94 6,50" fill="rgba(120,0,0,0.55)" stroke="#ff2a1a" stroke-width="5" />
          <rect x="45" y="24" width="10" height="34" rx="3" fill="#ff3b2a" />
          <circle cx="50" cy="71" r="6" fill="#ff3b2a" />
        </svg>
      </div>

      <div id="finisher-prompt">J &mdash; Finishing Blow</div>

      <div id="crosshair"></div>

      <section id="player-panel">
        <div id="focus" title="Focus: fills with perfect deflects">
          <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          <span class="label">J J L</span>
        </div>
        <div class="posture"><div class="fill"></div></div>
        <div class="bar health"><div class="fill"></div><div class="trail"></div></div>
      </section>

      <aside id="controls">
        <div><b>W A S D</b> move</div>
        <div><b>J</b> / left click &mdash; attack</div>
        <div><b>K</b> / right click &mdash; block (tap on the glint to deflect)</div>
        <div><b>Space</b> + A/D &mdash; dodge</div>
        <div><b>J J L</b> &mdash; Ember Strike (3 deflects charge it)</div>
        <div class="dim">Red warning = unblockable: dodge it</div>
      </aside>

      <div id="end-screen" class="hidden">
        <h1 id="end-title"></h1>
        <p id="end-sub"></p>
        <button id="restart-btn" type="button">Restart</button>
        <p class="hint">Press R or Enter</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
